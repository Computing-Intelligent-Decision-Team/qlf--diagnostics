cases:
  inverter_core:
    case_dir: examples/inverter_sky130_try
    top_cell: inverter_core
    vdd: VPWR
    vss: VGND
    convert_xschem: no
    raw_netlist: inverter_clean.sp
    magical_netlist: inverter_clean.sp
    config: inverter.json
    output_node: Y
    out_dir: generated/sky130_cases/inverter_core

  ota_core:
    case_dir: examples/ota_core_sky130_try
    top_cell: ota_core
    vdd: VDD
    vss: GND
    convert_xschem: yes
    raw_netlist: ota_core_raw.spice
    magical_netlist: ota_core_magical.sp
    config: ota_core.json
    output_node: VOUT
    out_dir: generated/sky130_cases/ota_core

  current_mirror_core:
    case_dir: examples/current_mirror_sky130_try
    top_cell: current_mirror_core
    vdd: VDD
    vss: GND
    convert_xschem: no
    magical_netlist: current_mirror_magical.sp
    config: current_mirror.json
    output_node: IOUT
    out_dir: generated/sky130_cases/current_mirror_core

  SMCNR_SE_2st_AMP:
    case_dir: examples/smcnr_se_2st_amp_sky130_try
    top_cell: SMCNR_SE_2st_AMP
    vdd: vdda
    vss: gnda
    convert_xschem: no
    magical_netlist: SMCNR_SE_2st_AMP_layout_physical_hspice.sp
    config: smcnr_se_2st_amp.json
    output_node: vout
    out_dir: generated/sky130_cases/smcnr_se_2st_amp
