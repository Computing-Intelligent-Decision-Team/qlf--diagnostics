# 当前 YAML 是工程映射草案。
# 不代表已经完成 Sky130 DRC-clean 适配。
# 后续需要用 Magic/KLayout DRC 验证。

schema_version: 0.1
source_analysis: docs/sky130_adapter/sky130_layer_mapping_analysis.md
status: draft
routing_stack_proposal: magical_M1_maps_to_sky130_li1
notes:
  - "examples/sky130PDK 当前仍是 mockPDK 副本；本文件用于后续生成真实 Sky130 版本的 techfile、simple techfile 和 LEF。"
  - "MAGICAL 当前 simple techfile 只有 layer number；Sky130 需要同时保留 GDS layer 和 datatype。"
  - "若 MAGICAL 保留 M1..M6 六层 routing 语义，建议第一阶段评估 li1/met1/met2/met3/met4/met5 栈。"

